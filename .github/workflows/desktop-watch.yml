name: Watch Claude Desktop
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-compatibility-watch
  cancel-in-progress: false
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.probe.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - run: |
          uv venv --python 3.11
          uv pip install -e . -c constraints.txt
      - id: probe
        run: .venv/bin/python scripts/desktop_compatibility.py --out "$RUNNER_TEMP/desktop-report"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: desktop-report
          path: ${{ runner.temp }}/desktop-report/
          retention-days: 7
          if-no-files-found: warn
  report-pr:
    needs: probe
    if: needs.probe.outputs.status == 'needs-review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-report
          path: ${{ runner.temp }}/desktop-report
      - run: python3 scripts/open_desktop_compatibility_pr.py --repo "$GITHUB_REPOSITORY" --report "$RUNNER_TEMP/desktop-report/report.json"
        env:
          GH_TOKEN: ${{ github.token }}
