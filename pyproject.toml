[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-config"
version = "0.6.1"
description = "Explicit Agent and App Profiles with checked configuration deployment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "tomlkit>=0.11,<1"]

[project.scripts]
claude-config = "claude_config.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_config = ["resources/*.md"]
