# Claude Config Manifest Template
# Copy this file to your private config repo and customize

version: 1
metadata:
  name: my-claude-config
  description: 个人 Claude Code 配置清单
  last_updated: "YYYY-MM-DD"
  last_sync_platform: ""
  # 配置仓库地址（让 agent 记住）
  config_repo:
    local: ~/claude-config-data           # 本地路径
    remote: ""                             # 远程仓库，如 github:username/repo

# 平台定义
platforms:
  mac: [darwin, macos]
  windows: [windows, win32, win64]
  linux: [linux, ubuntu, debian]

# Skills 配置
# 注意：除 claude-config bootstrap 外，所有 skill 应通过 claudespace marketplace 安装
# 将 skill 添加到 plugins.yaml 而非此处的 skills 段
#
# 三种安装来源：
#   - self (in claudespace):    自有 skill，git submodule 管理版本
#   - third-party (in claudespace): 三方 skill，marketplace.json sha 锁定版本
#   - infra plugin:             基础设施插件（superpowers, claude-hud, etc.），各自 marketplace

skills:
  # claude-config 自身（bootstrap skill — 唯一以文件形式安装的 skill）
  # claude-config:
  #   source: assets/skills/claude-config
  #   platforms: [all]
  #   description: 跨机器配置管理工具
  claude-config:
    source: assets/skills/claude-config
    platforms: [all]
    description: 跨机器配置管理工具（bootstrap skill）

# Rules 配置
rules: {}

# Agents 配置
agents: {}

# Settings 配置
settings:
  base:
    source: assets/settings/base.json
    merge_strategy: replace
    platforms: [all]

# Permissions（平台分类）
permissions:
  universal:
    source: assets/settings/permissions-universal.json
    merge_strategy:
      path: permissions.allow
      mode: merge_unique
    platforms: [all]

  mac:
    source: assets/settings/permissions-mac.json
    merge_strategy:
      path: permissions.allow
      mode: merge_unique
    platforms: [mac]

  windows:
    source: assets/settings/permissions-windows.json
    merge_strategy:
      path: permissions.allow
      mode: merge_unique
    platforms: [windows]

# Hooks 配置
# hooks:
#   statusline:
#     depends_on: [claude-hud]
#     mac:
#       source: assets/hooks/mac/statusline.sh
#       target: ~/.claude/statusline.sh
#       runtime: bash
#     windows:
#       source: assets/hooks/windows/statusline.ps1
#       target: ~/.claude/statusline.ps1
#       runtime: powershell
hooks: {}

# CLAUDE.md（用户级指令）
# claude_md:
#   source: assets/claude-md/CLAUDE.md
#   target: ~/.claude/CLAUDE.md
#   platforms: [all]

# Memory
# memory:
#   items:
#     my-workflow:
#       source: assets/memory/my-workflow.md
#       platforms: [all]

# 环境变量
env:
  expected:
    - ANTHROPIC_AUTH_TOKEN
    - ANTHROPIC_BASE_URL
  fixed: {}
    # CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS: "1"
    # ENABLE_TOOL_SEARCH: "true"

# 排除列表
exclude:
  - ~/.claude/config.json
  - ~/.claude.json
  - ~/.claude/teams/
  - ~/.claude/session-env/
  - ~/.claude/sessions/
  - ~/.claude/history.jsonl
  - ~/.claude/cache/
  - ~/.claude/telemetry/

# External Tools（外部工具与运行时依赖）
# 每项需指定 strategy:
#   auto   — 硬依赖，apply 自动安装（如 plugin 的运行时依赖）
#   prompt — 软依赖，apply 询问用户是否安装
#   manual — 复杂设置，apply 仅提示文档链接
#
# external:
#   codex-cli:
#     strategy: auto
#     source: npm:@openai/codex
#     type: npm
#     npm_package: "@openai/codex"
#     install: "npm install -g @openai/codex && codex login"
#     description: OpenAI Codex CLI（codex-plugin-cc 运行时依赖）
#     setup:
#       verify:
#         command: codex --help
#       boundary:
#         manages: runtime-dependency
#
#   my-tool:
#     strategy: prompt
#     type: npm
#     npm_package: "my-tool"
#     install: "npm install -g my-tool"
#     description: 可选工具
#     setup:
#       verify:
#         command: my-tool --help
#
#   complex-service:
#     strategy: manual
#     description: 需要 API key 的复杂服务
#     setup:
#       authority:
#         url: https://github.com/xxx/xxx
#       env:
#         required: [SERVICE_API_KEY]
external: {}
